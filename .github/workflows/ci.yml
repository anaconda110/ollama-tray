name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check lib/quota.js
          node --check lib/cost.js
          node --check lib/newapi.js
          node --check renderer/popup.js
          node --check renderer/settings.js
          node --check renderer/detail.js
          node --check scripts/analyze-history.js
      - name: Run unit tests
        run: npm test

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --publish never 是必须的：CI 环境下 electron-builder 会隐式尝试发布到 GitHub
      # Release，缺 GH_TOKEN 时报 "GitHub Personal Access Token is not set" 并让整个 job 失败。
      # 发布由维护者手动完成（见 README「发布」）。
      - name: Build (electron-builder)
        run: npm run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: ollama-tray-win
          path: dist/
          if-no-files-found: error
          retention-days: 14

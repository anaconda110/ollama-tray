name: Feature request
description: 提出一个新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - UI / 显示
        - 数据获取 / API
        - 托盘 / 系统集成
        - 其他

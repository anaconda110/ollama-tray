<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="quota-card">
    <header class="card-head">
      <div class="brand">
        <img class="logo" src="../assets/ollama-square.png" alt="Ollama">
        <div class="titles">
          <h1 data-i18n="title">Ollama</h1>
          <p class="subtitle" data-i18n="subtitle">Cloud 配额</p>
        </div>
      </div>
      <span class="status" id="statusBadge">
        <i class="dot"></i><span id="statusText" data-i18n="statusOk">正常</span>
      </span>
    </header>

    <section class="hero-pct">
      <span class="big-num" id="heroNum">0</span>
      <span class="big-unit">%</span>
      <span class="hero-label"><span id="heroLabel">5h 已用 ·</span> <span id="planLabel"></span></span>
    </section>

    <div class="bar-row">
      <div class="bar-meta">
        <span class="bar-label" id="label5h">5h</span>
        <span class="bar-pct" id="pct5h">0%</span>
      </div>
      <div class="bar-track bar-track--pink">
        <div class="bar-fill" id="fill5h" style="width:0%"></div>
      </div>
      <div class="bar-reset">
        <span id="reset5h">--</span> <span id="reset5hSuffix">后重置</span>
      </div>
    </div>

    <div class="bar-row">
      <div class="bar-meta">
        <span class="bar-label" id="labelWeekly">每周</span>
        <span class="bar-pct" id="pctWeek">0%</span>
      </div>
      <div class="bar-track bar-track--orange">
        <div class="bar-fill" id="fillWeek" style="width:0%"></div>
      </div>
      <div class="bar-reset">
        <span id="resetWeek">--</span> <span id="resetWeekSuffix">后重置</span>
      </div>
    </div>

    <footer class="card-foot">
      <span class="req" id="req24h"></span>
      <span class="updated" id="updatedText" data-i18n="updated">刚刚更新</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
